name: Leer portales de empleo

on:
  schedule:
    # 30 min antes de cada ronda de la rutina (6:30, 11:30 y 16:30 hora Bogotá)
    - cron: "30 11,16,21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portales
  cancel-in-progress: false

jobs:
  leer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Leer elempleo, LinkedIn, Computrabajo y Magneto
        run: python radar/portales.py
      - name: Guardar en el repo
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add radar/portales.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Portales: ofertas para evaluar actualizadas"
          git pull --rebase origin main
          git push origin HEAD:main
